<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ôn tập Tin học 6</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--pri:#2563eb;--pri2:#1d4ed8;--soft:#eef4ff;--ok:#15803d;--bad:#c62828;--okbg:#eefbf3;--badbg:#fff1f1;--warn:#9a6700;--warnbg:#fff8e6;--shadow:0 10px 28px rgba(16,24,40,.08)}
html[data-theme="dark"]{--bg:#0f131a;--card:#181d27;--text:#f5f7fa;--muted:#aab3c0;--line:#303746;--pri:#60a5fa;--pri2:#3b82f6;--soft:#172338;--ok:#4ade80;--bad:#f87171;--okbg:#13261a;--badbg:#2b1717;--warn:#fbbf24;--warnbg:#2a2519;--shadow:0 10px 28px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}
.wrap{max-width:940px;margin:auto;padding:14px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:6px 0 14px}h1{font-size:clamp(1.35rem,4vw,1.9rem);margin:0}h2{margin:.25rem 0 .4rem}.muted{color:var(--muted)}.small{font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:12px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--pri);color:#fff;font-weight:750}.btn:hover{background:var(--pri2)}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--pri);font-size:.82rem;font-weight:750}.badge.warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}.notice{padding:11px 12px;border-radius:12px;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);font-size:.92rem}
.progress{height:9px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),#7c3aed)}.scenario{padding:11px 12px;border-radius:12px;border-left:4px solid var(--pri);background:var(--soft);margin:10px 0}.question{font-size:clamp(1.08rem,3.7vw,1.35rem);font-weight:780;margin:14px 0}
.options{display:grid;gap:9px}.option{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text)}.option.selected{border:2px solid var(--pri);padding:12px;background:var(--soft)}.option.correct{border-color:var(--ok);background:var(--okbg)}.option.wrong{border-color:var(--bad);background:var(--badbg)}.key{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--pri);font-weight:800}
.feedback{margin-top:13px;padding:13px;border-radius:12px;background:var(--soft)}.feedback.good{border-left:4px solid var(--ok)}.feedback.bad{border-left:4px solid var(--bad)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:15px;text-align:center}.stat b{display:block;font-size:1.5rem}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text)}.pill.active{background:var(--pri);border-color:var(--pri);color:#fff}.review{padding:16px 0;border-top:1px solid var(--line)}.review:first-child{border-top:0}.review-q{font-weight:760;margin:8px 0}.history-item{padding:12px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}
@media(max-width:640px){.wrap{padding:10px}.card{padding:14px;border-radius:16px}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.btn{padding:10px 12px}}
</style></head>
<body><div class="wrap">
<header class="topbar"><div><h1>Ôn tập Tin học 6</h1><div class="muted small">Website độc lập • tối ưu điện thoại/iPhone/iPad</div></div><button id="themeBtn" class="btn secondary">🌙</button></header>

<section id="startScreen" class="card"><span class="badge">Tổng số: <span id="totalCount"></span> mục chấm điểm</span><h2>Bắt đầu ôn tập</h2><div class="muted">30 câu A/B/C/D + 24 ý Đúng/Sai.</div>
<p class="notice"><b>Nguồn đáp án:</b> giữ nguyên đáp án và giải thích trong tài liệu đính kèm; không lấy các dấu khoanh/ghi tay làm đáp án chuẩn.</p>
<div class="grid2"><label class="field">Số câu<select id="countSel"><option value="10">10 câu</option><option value="20">20 câu</option><option value="30" selected>30 câu</option><option value="50">50 câu</option><option value="all">Toàn bộ</option></select></label><label class="field">Chế độ<select id="modeSel"><option value="exam">Làm đề</option><option value="learn">Học từng câu</option></select></label></div>
<div class="row" style="margin:14px 0"><label><input id="shuffleQ" type="checkbox" checked> Xáo trộn câu</label><label><input id="shuffleA" type="checkbox" checked> Xáo trộn đáp án</label></div>
<div class="row"><button id="startBtn" class="btn">Bắt đầu</button><button id="wrongBtn" class="btn secondary">Ôn câu sai</button><button id="historyBtn" class="btn secondary">Lịch sử</button></div></section>

<section id="quizScreen" class="hidden"><div class="card"><div class="row between"><span id="sectionBadge" class="badge"></span><span id="counter" class="muted small"></span></div><div class="progress"><i id="progressBar"></i></div><span id="reviewBadge" class="badge warn hidden">⚠ Cần kiểm tra dữ liệu</span><div id="scenarioBox" class="scenario hidden"></div><div id="questionText" class="question"></div><div id="optionsBox" class="options"></div><div id="feedbackBox"></div><div class="row between" style="margin-top:16px"><button id="prevBtn" class="btn secondary">← Câu trước</button><div class="row"><button id="nextBtn" class="btn secondary">Câu tiếp →</button><button id="submitBtn" class="btn">Nộp bài</button></div></div></div></section>
<section id="resultScreen" class="hidden"></section><section id="historyScreen" class="card hidden"></section>
</div>
<script>
const APP_CONFIG={subject:"Tin học 6",storagePrefix:"tin6_review_v3"};
const QUESTION_BANK=[{"id":"MCQ-01","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Theo tình huống trong SGK, âm thanh của tiếng trống trường vang lên báo hiệu giờ ra chơi, âm thanh đó được gọi là gì?","options":[{"id":"A","text":"Thông tin"},{"id":"B","text":"Dữ liệu"},{"id":"C","text":"Vật mang tin"},{"id":"D","text":"Quá trình xử lí"}],"answer":"B","explanation":"Âm thanh tiếng trống là dạng dữ liệu mà con người tiếp nhận bằng thính giác. Từ dữ liệu đó, học sinh hiểu được thông tin rằng đã đến giờ ra chơi.","needsReview":false},{"id":"MCQ-02","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Trong bản tin dự báo thời tiết trên tivi, con số “25 độ C” và hình ảnh đám mây hiển thị trên màn hình đóng vai trò là gì?","options":[{"id":"A","text":"Dữ liệu"},{"id":"B","text":"Thông tin"},{"id":"C","text":"Vật mang tin"},{"id":"D","text":"Thiết bị xử lí"}],"answer":"A","explanation":"Con số 25°C và biểu tượng đám mây là các dữ liệu được biểu diễn bằng số và hình ảnh. Khi con người đọc, hiểu chúng thì thu được thông tin về thời tiết.","needsReview":false},{"id":"MCQ-03","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Bạn Minh đang đọc một trang sách giáo khoa để hiểu về mạng máy tính. Trang sách giáo khoa bằng giấy đó đóng vai trò là gì?","options":[{"id":"A","text":"Dữ liệu"},{"id":"B","text":"Thông tin"},{"id":"C","text":"Vật mang tin"},{"id":"D","text":"Môi trường truyền tin"}],"answer":"C","explanation":"Trang sách là phương tiện chứa và mang nội dung đến người đọc, vì vậy nó là vật mang tin.","needsReview":false},{"id":"MCQ-04","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Trên tivi, An xem tin dự báo thời tiết báo có mưa. An quyết định mang ô khi ra khỏi nhà. Quyết định mang ô là kết quả của quá trình nào?","options":[{"id":"A","text":"Truyền thông tin"},{"id":"B","text":"Thu nhận thông tin"},{"id":"C","text":"Lưu trữ thông tin"},{"id":"D","text":"Xử lí thông tin"}],"answer":"D","explanation":"An tiếp nhận dự báo có mưa, suy nghĩ và đưa ra quyết định mang ô. Việc biến thông tin đã nhận thành quyết định là xử lí thông tin.","needsReview":false},{"id":"MCQ-05","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Theo SGK, quá trình xử lí thông tin của máy tính gồm những hoạt động cơ bản nào?","options":[{"id":"A","text":"Nhìn, nghe, suy nghĩ và hành động"},{"id":"B","text":"Ghi chép, phân tích, sao chép và in ấn"},{"id":"C","text":"Thu nhận, xử lí, lưu trữ và truyền thông tin"},{"id":"D","text":"Quét mã vạch, tính toán, kết nối và gửi đi"}],"answer":"C","explanation":"Bốn hoạt động cơ bản của quá trình xử lí thông tin là thu nhận, xử lí, lưu trữ và truyền thông tin.","needsReview":false},{"id":"MCQ-06","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Bạn An sử dụng máy quét (Scanner) để quét một bức ảnh giấy đưa vào máy tính. Máy quét thuộc loại thiết bị nào?","options":[{"id":"A","text":"Thiết bị vào"},{"id":"B","text":"Thiết bị ra"},{"id":"C","text":"Thiết bị lưu trữ"},{"id":"D","text":"Thiết bị xử lí"}],"answer":"A","explanation":"Scanner đưa dữ liệu hình ảnh từ bên ngoài vào máy tính nên là thiết bị vào.","needsReview":false},{"id":"MCQ-07","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Khi bạn Khoa gõ bàn phím để làm bài tập, máy tính hiển thị chữ lên màn hình. Màn hình đóng vai trò là thiết bị gì?","options":[{"id":"A","text":"Thiết bị vào"},{"id":"B","text":"Thiết bị ra"},{"id":"C","text":"Bộ lưu trữ"},{"id":"D","text":"Bộ xử lí"}],"answer":"B","explanation":"Màn hình đưa kết quả từ máy tính ra cho người dùng quan sát nên là thiết bị ra.","needsReview":false},{"id":"MCQ-08","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Thiết bị nào trong máy tính được ví như “bộ não” đảm nhận công việc xử lí thông tin?","options":[{"id":"A","text":"RAM"},{"id":"B","text":"Ổ cứng"},{"id":"C","text":"Bàn phím"},{"id":"D","text":"Bộ vi xử lí trung tâm (CPU)"}],"answer":"D","explanation":"CPU thực hiện các lệnh và xử lí dữ liệu, vì vậy thường được ví như bộ não của máy tính.","needsReview":false},{"id":"MCQ-09","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Việc em cắm một chiếc USB vào máy tính để chép lại tệp bài về trên lớp mang về nhà thuộc hoạt động nào của máy tính?","options":[{"id":"A","text":"Thu nhận thông tin"},{"id":"B","text":"Truyền thông tin"},{"id":"C","text":"Lưu trữ thông tin"},{"id":"D","text":"Phát thông tin"}],"answer":"C","explanation":"USB là thiết bị lưu trữ; chép tệp vào USB là lưu dữ liệu để dùng lại sau.","needsReview":false},{"id":"MCQ-10","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Trong tình huống tại siêu thị, máy đọc mã vạch quét mã trên sản phẩm để lấy thông tin. Máy đọc mã vạch đóng vai trò là thiết bị gì?","options":[{"id":"A","text":"Thiết bị vào"},{"id":"B","text":"Thiết bị ra"},{"id":"C","text":"Thiết bị lưu trữ lâu dài"},{"id":"D","text":"Bộ vi xử lí"}],"answer":"A","explanation":"Máy đọc mã vạch thu nhận mã từ sản phẩm và đưa dữ liệu vào hệ thống nên là thiết bị vào.","needsReview":false},{"id":"MCQ-11","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Em cắm tai nghe vào máy tính để nghe một bản nhạc MP3. Tai nghe được phân loại vào nhóm thiết bị nào?","options":[{"id":"A","text":"Thiết bị vào"},{"id":"B","text":"Thiết bị ra"},{"id":"C","text":"Thiết bị xử lí"},{"id":"D","text":"Bộ nhớ đệm"}],"answer":"B","explanation":"Tai nghe phát âm thanh từ máy tính đến người dùng nên là thiết bị ra.","needsReview":false},{"id":"MCQ-12","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"So với não người, máy tính vượt trội hơn hẳn ở khả năng nào khi thực hiện xử lí thông tin?","options":[{"id":"A","text":"Có thể tự sáng tạo ra nghệ thuật"},{"id":"B","text":"Nhận biết và thấu hiểu cảm xúc"},{"id":"C","text":"Tính toán với tốc độ rất cao và chính xác"},{"id":"D","text":"Ra quyết định dựa trên tình cảm"}],"answer":"C","explanation":"Máy tính có ưu thế nổi bật về tốc độ tính toán và độ chính xác khi thực hiện đúng chương trình.","needsReview":false},{"id":"MCQ-13","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Để máy tính có thể hiểu, xử lí và lưu trữ, mọi thông tin (chữ viết, âm thanh, hình ảnh) phải được chuyển đổi thành dạng nào?","options":[{"id":"A","text":"Dãy chữ cái tiếng Anh"},{"id":"B","text":"Dãy các con số thập phân từ 0 đến 9"},{"id":"C","text":"Dãy các kí hiệu 0 và 1"},{"id":"D","text":"Dãy mã vạch siêu thị"}],"answer":"C","explanation":"Trong máy tính, dữ liệu được biểu diễn dưới dạng dãy bit gồm hai kí hiệu 0 và 1.","needsReview":false},{"id":"MCQ-14","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Dãy các kí hiệu 0 và 1 dùng để biểu diễn thông tin bên trong mạch điện tử của máy tính được gọi là gì?","options":[{"id":"A","text":"Dãy Bit"},{"id":"B","text":"Dãy Byte"},{"id":"C","text":"Dãy mã hóa"},{"id":"D","text":"Dãy tín hiệu"}],"answer":"A","explanation":"Bit là đơn vị thông tin cơ bản, có hai trạng thái thường được biểu diễn bằng 0 và 1.","needsReview":false},{"id":"MCQ-15","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Một kí tự chữ cái thông thường (ví dụ chữ “A” trên bàn phím) thường được lưu trữ trong máy tính với dung lượng là bao nhiêu?","options":[{"id":"A","text":"1 Bit"},{"id":"B","text":"1 Byte"},{"id":"C","text":"1 KB"},{"id":"D","text":"1 MB"}],"answer":"B","explanation":"Theo quy ước kiến thức cơ bản trong bài học, một kí tự thông thường được tính khoảng 1 Byte.","needsReview":false},{"id":"MCQ-16","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Một tệp văn bản bài tập có dung lượng là 2 KB. Dung lượng này tương đương với bao nhiêu Byte?","options":[{"id":"A","text":"1024 Byte"},{"id":"B","text":"2000 Byte"},{"id":"C","text":"2048 Byte"},{"id":"D","text":"2400 Byte"}],"answer":"C","explanation":"1 KB = 1024 Byte, nên 2 KB = 2 × 1024 = 2048 Byte.","needsReview":false},{"id":"MCQ-17","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Một bài hát có dung lượng khoảng 4 MB. Một thẻ nhớ có dung lượng 1 GB có thể chứa được tối đa bao nhiêu bài hát như vậy? (Biết 1 GB = 1024 MB).","options":[{"id":"A","text":"200 bài"},{"id":"B","text":"256 bài"},{"id":"C","text":"512 bài"},{"id":"D","text":"1024 bài"}],"answer":"B","explanation":"1 GB = 1024 MB. Số bài tối đa = 1024 ÷ 4 = 256 bài.","needsReview":false},{"id":"MCQ-18","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Đơn vị cơ bản nhỏ nhất dùng để đo dung lượng lưu trữ thông tin của máy tính là gì?","options":[{"id":"A","text":"Megabyte (MB)"},{"id":"B","text":"Kilobyte (KB)"},{"id":"C","text":"Byte"},{"id":"D","text":"Bit"}],"answer":"D","explanation":"Bit là đơn vị thông tin nhỏ nhất, chỉ có thể nhận một trong hai giá trị 0 hoặc 1.","needsReview":false},{"id":"MCQ-19","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Thứ tự sắp xếp các đơn vị đo dung lượng thông tin từ nhỏ đến lớn nào sau đây là hoàn toàn chính xác?","options":[{"id":"A","text":"Bit, KB, Byte, MB, GB, TB"},{"id":"B","text":"Bit, Byte, KB, MB, GB, TB"},{"id":"C","text":"Byte, Bit, KB, GB, MB, TB"},{"id":"D","text":"TB, GB, MB, KB, Byte, Bit"}],"answer":"B","explanation":"Thứ tự tăng dần là Bit → Byte → KB → MB → GB → TB.","needsReview":false},{"id":"MCQ-20","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Theo tình huống SGK về biểu diễn thông tin, 8 bóng đèn xếp nối tiếp nhau (mỗi đèn có 2 trạng thái sáng/tắt) mô phỏng mức dung lượng là bao nhiêu?","options":[{"id":"A","text":"1 Bit"},{"id":"B","text":"8 Byte"},{"id":"C","text":"1 Byte"},{"id":"D","text":"1 KB"}],"answer":"C","explanation":"Mỗi bóng đèn có 2 trạng thái tương ứng 1 bit. 8 bóng đèn = 8 bit = 1 Byte.","needsReview":false},{"id":"MCQ-21","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Theo khái niệm trong SGK, mạng máy tính là gì?","options":[{"id":"A","text":"Là tập hợp các máy tính được kết nối với nhau để chia sẻ dữ liệu và thiết bị"},{"id":"B","text":"Là tên gọi của phần mềm lướt web trên Internet"},{"id":"C","text":"Là một chiếc máy tính được cắm dây mạng để chơi game"},{"id":"D","text":"Là thiết bị phát sóng Wi-Fi trong gia đình"}],"answer":"A","explanation":"Mạng máy tính là tập hợp các máy tính và thiết bị được kết nối để trao đổi dữ liệu và dùng chung tài nguyên.","needsReview":false},{"id":"MCQ-22","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Trong phòng máy thực hành của trường có 30 máy tính được kết nối mạng với nhau. Mạng này thuộc loại mạng nào?","options":[{"id":"A","text":"Mạng diện rộng (WAN)"},{"id":"B","text":"Mạng toàn cầu (Internet)"},{"id":"C","text":"Mạng không dây cá nhân (Bluetooth)"},{"id":"D","text":"Mạng cục bộ (LAN)"}],"answer":"D","explanation":"Các máy tính nằm trong phạm vi nhỏ như một phòng thực hành thuộc mạng cục bộ LAN.","needsReview":false},{"id":"MCQ-23","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Thiết bị nào sau đây là thiết bị kết nối mạng, giúp chuyển tiếp tín hiệu giữa các máy tính trong phòng thực hành?","options":[{"id":"A","text":"Màn hình cảm ứng"},{"id":"B","text":"Bộ chuyển mạch (Switch)"},{"id":"C","text":"Bàn phím không dây"},{"id":"D","text":"Máy in Laser"}],"answer":"B","explanation":"Switch là thiết bị mạng dùng để kết nối nhiều thiết bị trong cùng mạng LAN và chuyển tiếp dữ liệu giữa chúng.","needsReview":false},{"id":"MCQ-24","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Việc kết nối mạng lưới máy tính trong phòng thực hành Tin học KHÔNG mang lại lợi ích nào sau đây?","options":[{"id":"A","text":"Cho phép nhiều máy tính dùng chung một máy in"},{"id":"B","text":"Giúp học sinh dễ dàng gửi tệp tin bài tập cho giáo viên"},{"id":"C","text":"Giúp các phần cứng của máy tính không bao giờ bị hỏng"},{"id":"D","text":"Hỗ trợ chia sẻ tài nguyên phần mềm giữa các máy"}],"answer":"C","explanation":"Mạng giúp chia sẻ dữ liệu, thiết bị và tài nguyên; nó không thể bảo đảm phần cứng không bao giờ hỏng.","needsReview":false},{"id":"MCQ-25","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Khi tham gia câu lạc bộ Khoa học, em thấy trên bảng hướng dẫn có ghi “Độ ẩm đất: 60%”. Dòng chữ “Độ ẩm đất: 60%” ghi trên bảng đóng vai trò là gì?","options":[{"id":"A","text":"Thông tin"},{"id":"B","text":"Dữ liệu"},{"id":"C","text":"Vật mang tin"},{"id":"D","text":"Quá trình xử lí"}],"answer":"B","explanation":"Dòng chữ và con số là dữ liệu được ghi lại; bảng là vật mang tin. Khi người đọc hiểu ý nghĩa của dữ liệu thì nhận được thông tin về độ ẩm đất.","needsReview":false},{"id":"MCQ-26","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Thiết bị nào sau đây được sử dụng để nhập dữ liệu âm thanh (giọng nói) vào máy tính?","options":[{"id":"A","text":"Màn hình"},{"id":"B","text":"Loa"},{"id":"C","text":"Micro"},{"id":"D","text":"Máy in"}],"answer":"C","explanation":"Micro thu âm thanh từ môi trường và đưa tín hiệu vào máy tính nên là thiết bị vào.","needsReview":false},{"id":"MCQ-27","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Trong dự án “Ngôi nhà năng lượng tái tạo”, em dùng phần mềm Scratch để lập trình mô phỏng lại hệ thống. Việc phần mềm tự động tính toán thời gian mặt trời chiếu và năng lượng được tạo đóng góp?","options":[{"id":"A","text":"Thu nhận thông tin"},{"id":"B","text":"Lưu trữ thông tin"},{"id":"C","text":"Truyền thông tin"},{"id":"D","text":"Xử lí thông tin"}],"answer":"D","explanation":"Phần mềm nhận dữ liệu đầu vào và thực hiện tính toán để tạo ra kết quả, đó là hoạt động xử lí thông tin.","needsReview":false},{"id":"MCQ-28","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Nếu em có một tệp tài liệu báo cáo dung lượng là 3 MB, dung lượng này tương đương với bao nhiêu Kilobyte (KB)?","options":[{"id":"A","text":"1024 KB"},{"id":"B","text":"3000 KB"},{"id":"C","text":"3072 KB"},{"id":"D","text":"3048 KB"}],"answer":"C","explanation":"1 MB = 1024 KB, nên 3 MB = 3 × 1024 = 3072 KB.","needsReview":false},{"id":"MCQ-29","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Máy tính dùng tín hiệu nào dưới đây để có thể “hiểu” và thực thi các câu lệnh lập trình?","options":[{"id":"A","text":"Các kí tự chữ cái tiếng Anh"},{"id":"B","text":"Các con số thập phân từ 0 đến 9"},{"id":"C","text":"Các sóng âm thanh"},{"id":"D","text":"Dãy bit gồm các kí hiệu 0 và 1"}],"answer":"D","explanation":"Ở mức biểu diễn trong máy tính, dữ liệu và lệnh được mã hóa thành các dãy bit 0 và 1.","needsReview":false},{"id":"MCQ-30","type":"mcq","section":"Phần I – Câu hỏi nhiều lựa chọn","question":"Tại phòng thực hành Tin học của LomonoXop High School, tất cả các máy tính đều được kết nối mạng với nhau. Mục đích lớn nhất của việc kết nối này là gì?","options":[{"id":"A","text":"Để máy tính chạy nhanh hơn và không bị nóng"},{"id":"B","text":"Để chia sẻ dữ liệu và dùng chung thiết bị phần cứng"},{"id":"C","text":"Để tăng dung lượng lưu trữ trên từng máy tính"},{"id":"D","text":"Để bảo vệ các máy tính không bao giờ bị nhiễm virus"}],"answer":"B","explanation":"Lợi ích chính của mạng máy tính là chia sẻ dữ liệu, tài nguyên và các thiết bị dùng chung như máy in.","needsReview":false},{"id":"TF-01a","type":"tf","section":"Phần II – Câu hỏi Đúng/Sai","parentQuestion":"Câu 1","scenario":"Tình huống thực tế: Minh xem bản tin dự báo thời tiết trên tivi, thấy màn hình hiện con số “15 độ C” và biểu tượng băng giá. Minh lập tức đi lấy áo khoác len để chuẩn bị mặc đi học.","question":"Tivi đang phát bản tin đóng vai trò là vật mang tin.","options":[{"id":"T","text":"Đúng"},{"id":"F","text":"Sai"}],"answer":"T","explanation":"Tivi/màn hình là phương tiện mang và trình bày nội dung dự báo đến Minh.","needsReview":false},{"id":"TF-01b","type":"tf","section":"Phần II – Câu hỏi Đúng/Sai","parentQuestion":"Câu 1","scenario":"Tình huống thực tế: Minh xem bản tin dự báo thời tiết trên tivi, thấy ":"T","text":"Đúng"},{"id":"F","text":"Sai"}],"answer":"T","explanation":"Các số được đưa từ người dùng vào máy tính qua bàn phím nên là bước nhập/thu nhận dữ liệu.","needsReview":false},{"id":"TF-02b","type":"tf","section":"Phần II – Câu hỏi Đúng/Sai","parentQuestion":"Câu 2","scenario":"Trong giờ Tin học, bạn Khoa dùng phần mềm Máy tính (Calculator) trên máy để tính tổng hai số 15 và 20, sau đó màn hình hiện ra kết quả là 35.","question":"Bàn phím Khoa đang sử dụng đóng vai trò là thiết bị đầu ra của máy tính.","options":[{"id":"T","text":"Đúng"},{"id":"F","text":"Sai"}],"answer":"F","explanation":"Bàn phím là thiết bị vào vì dùng để nhập dữ liệu và lệnh.","needsReview":false},{"id":"TF-02c","type":"tf","section":"Phần II – Câu hỏi Đúng/Sai","parentQuestion":"Câu 2","scenario":"Trong giờ Tin học, bạn Khoa dùng phần mềm Máy tính (Calculator) trên máy để tính tổng hai số 15 và 20, sau đó màn hình hiện ra kết quả là 35.","question":"Bộ vi xử lí (CPU) của máy tính thực hiện thao tác cộng hai số lại với nhau.","options":[{"id":"T","text":"Đúng"},{"id":"F","text":"Sai"}],"answer":"T","explanation":"CPU thực hiện các lệnh tính toán của chương trình, trong đó có phép cộng.","needsReview":false},{"id":"TF-02d","type":"tf","section":"Phần II – Câu hỏi Đúng/Sai","parentQuestion":"Câu 2","scenario":"Trong giờ Tin học, bạn Khoa dùng phần mềm Máy tính (Calculator) trên máy để tính tổng hai số 15 và 20, sau đó màn hình hiện ra kết quả là 35.","question":"Con số 35 hiện lên màn hình là kết quả đầu ra của quá trình xử lí thông tin.","options":[{"id":"T","text":"Đúng"},{"id":"F","text":"Sai"}],"answer":"T","explanation":"35 là kết quả sau khi dữ liệu 15 và 20 được xử lí; màn hình đưa kết quả ra cho người dùng.","needsReview":false},{"id":"TF-03a","type":"tf","section":"Phần II – Câu hỏi Đúng/Sai","parentQuestion":"Câu 3","scenario":"SGK đưa ra hình ảnh minh họa việc sử dụng các bóng đèn để biểu diễn thông tin. Nam sử dụng một dãy gồm 8 bóng đèn xếp hàng ngang (đèn sáng kí hiệu là 1 const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));
function shuffleArray(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function readStore(k,f){try{const r=localStorage.getItem(APP_CONFIG.storagePrefix+"_"+k);return r===null?f:JSON.parse(r)}catch(e){return f}}
function writeStore(k,v){try{localStorage.setItem(APP_CONFIG.storagePrefix+"_"+k,JSON.stringify(v));return true}catch(e){console.warn(e);return false}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
let quizItems=[],currentIndex=0,userAnswers={},optionOrder={},currentMode="exam",latestResult=null;
$("totalCount").textContent=QUESTION_BANK.length;
function setTheme(t){document.documentElement.dataset.theme=t;$("themeBtn").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem(APP_CONFIG.storagePrefix+"_theme",t)}catch(e){}}
let saved="";try{saved=localStorage.getItem(APP_CONFIG.storagePrefix+"_theme")||""}catch(e){}setTheme(saved);
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"":"dark");
const getMistakes=()=>readStore("mistakes",{}), getQuizHistory=()=>readStore("history",[]);
function answerText(q,id){const o=(q.options||[]).find(x=>x.id===id);return o?o.id+". "+o.text:(id||"Chưa trả lời")}
function buildQuiz(wrongOnly){let pool=clone(QUESTION_BANK);if(wrongOnly){const m=getMistakes();pool=pool.filter(q=>(m[q.id]||0)>0).sort((a,b)=>(m[b.id]||0)-(m[a.id]||0));if(!pool.length){alert("Chưa có câu sai trong lịch sử để ôn.");return null}}else if($("shuffleQ").checked)pool=shuffleArray(pool);const s=$("countSel").value,n=s==="all"?pool.length:Math.min(parseInt(s,10),pool.length);return pool.slice(0,n)}
function startQuiz(wrongOnly){const b=buildQuiz(!!wrongOnly);if(!b)return;quizItems=b;currentIndex=0;userAnswers={};optionOrder={};currentMode=$("modeSel").value;$("startScreen").classList.add("hidden");$("resultScreen").classList.add("hidden");$("historyScreen").classList.add("hidden");$("quizScreen").classList.remove("hidden");renderQuestion()}
function renderQuestion(){const q=quizItems[currentIndex];$("sectionBadge").textContent=q.section;$("counter").textContent=(currentIndex+1)+" / "+quizItems.length;$("progressBar").style.width=((currentIndex+1)/quizItems.length*100)+"%";$("questionText").textContent=q.question;$("reviewBadge").classList.toggle("hidden",!q.needsReview);if(q.scenario){$("scenarioBox").textContent=(q.parentQuestion?q.parentQuestion+" — ":"")+q.scenario;$("scenarioBox").classList.remove("hidden")}else $("scenarioBox").classList.add("hidden");if(!optionOrder[q.id])optionOrder[q.id]=$("shuffleA").checked?shuffleArray(q.options):clone(q.options);const box=$("optionsBox");box.innerHTML="";optionOrder[q.id].forEach(o=>{const b=document.createElement("button");b.type="button";b.className="option"+(userAnswers[q.id]===o.id?" selected":"");if(currentMode==="learn"&&userAnswers[q.id]!==undefined){if(o.id===q.answer)b.classList.add("correct");if(o.id===userAnswers[q.id]&&o.id!==q.answer)b.classList.add("wrong")}b.innerHTML='<span class="key">'+esc(o.id)+'</span><span>'+esc(o.text)+'</span>';b.onclick=()=>{userAnswers[q.id]=o.id;renderQuestion()};box.appendChild(b)});$("feedbackBox").innerHTML="";if(currentMode==="learn"&&userAnswers[q.id]!==undefined){const ok=userAnswers[q.id]===q.answer;$("feedbackBox").innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'✓ Đúng':'✗ Chưa đúng')+'</b><br>Đáp án đúng: <b>'+esc(answerText(q,q.answer))+'</b><br><span class="muted">'+esc(q.explanation)+'</span></div>'}$("prevBtn").disabled=currentIndex===0;$("nextBtn").disabled=currentIndex===quizItems.length-1}
function submitQuiz(){let correct=0,wrong=0,blank=0;const m=getMistakes();quizItems.forEach(q=>{const a=userAnswers[q.id];if(a===undefined)blank++;else if(a===q.answer)correct++;else{wrong++;m[q.id]=(m[q.id]||0)+1}});writeStore("mistakes",m);const r={id:Date.now(),date:new Date().toLocaleString("vi-VN"),total:quizItems.length,correct,wrong,blank,percent:Math.round(correct/quizItems.length*100)};const logs=getQuizHistory();logs.unshift(r);writeStore("history",logs.slice(0,40));latestResult=r;$("quizScreen").classList.add("hidden");showResult(r,"all")}
function showResult(r,filter){$("resultScreen").classList.remove("hidden");const filtered=quizItems.filter(q=>{const a=userAnswers[q.id];if(filter==="correct")return a!==undefined&&a===q.answer;if(filter==="wrong")return a!==undefined&&a!==q.answer;if(filter==="blank")return a===undefined;return true});const rows=filtered.map(q=>{const a=userAnswers[q.id],status=a===undefined?"Chưa trả lời":a===q.answer?"Đúng":"Sai";return '<div class="review"><div class="row between"><span class="badge">'+esc(q.id)+'</span><b>'+status+'</b></div>'+(q.scenario?'<div class="scenario small">'+esc((q.parentQuestion?q.parentQuestion+" — ":"")+q.scenario)+'</div>':'')+'<div class="review-q">'+esc(q.question)+'</div><div>Bạn chọn: <b>'+esc(a===undefined?"Chưa trả lời":answerText(q,a))+'</b></div><div>Đáp án đúng: <b>'+esc(answerText(q,q.answer))+'</b></div><div class="feedback"><b>Giải thích:</b> '+esc(q.explanation)+'</div>'+(q.needsReview?'<div class="badge warn" style="margin-top:8px">⚠ Cần kiểm tra dữ liệu</div>':'')+'</div>'}).join("");$("resultScreen").innerHTML='<div class="card"><h2>Kết quả</h2><div class="stats"><div class="stat"><b>'+r.correct+'</b>Đúng</div><div class="stat"><b>'+r.wrong+'</b>Sai</div><div class="stat"><b>'+r.blank+'</b>Chưa trả lời</div><div class="stat"><b>'+r.percent+'%</b>Tỷ lệ</div></div><div class="pills" style="margin:15px 0"><button class="pill '+(filter==="all"?"active":"")+'" data-filter="all">Tất cả</button><button class="pill '+(filter==="correct"?"active":"")+'" data-filter="correct">Câu đúng</button><button class="pill '+(filter==="wrong"?"active":"")+'" data-filter="wrong">Câu sai</button><button class="pill '+(filter==="blank"?"active":"")+'" data-filter="blank">Chưa trả lời</button></div>'+(rows||'<p class="muted">Không có câu nào trong bộ lọc này.</p>')+'<div class="row" style="margin-top:16px"><button id="homeBtnResult" class="btn">Làm đề khác</button><button id="wrongBtnResult" class="btn secondary">Ôn câu sai</button></div></div>';$("resultScreen").querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>showResult(latestResult,b.dataset.filter));$("homeBtnResult").onclick=goHome;$("wrongBtnResult").onclick=()=>startQuiz(true)}
function showHistoryScreen(){$("startScreen").classList.add("hidden");$("quizScreen").classList.add("hidden");$("resultScreen").classList.add("hidden");$("historyScreen").classList.remove("hidden");const logs=getQuizHistory(),m=getMistakes(),top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);$("historyScreen").innerHTML='<h2>Lịch sử làm bài</h2>'+(logs.length?logs.map(x=>'<div class="history-item"><b>'+esc(x.date)+'</b><br>'+x.correct+'/'+x.total+' đúng • '+x.percent+'% • sai '+x.wrong+' • bỏ '+x.blank+'</div>').join(""):'<p class="muted">Chưa có lịch sử.</p>')+'<h3>Câu thường sai</h3>'+(top.length?top.map(x=>'<span class="badge" style="margin:4px">'+esc(x[0])+': '+x[1]+' lần</span>').join(""):'<p class="muted">Chưa có dữ liệu.</p>')+'<div style="margin-top:16px"><button id="backHomeBtn" class="btn">Quay lại</button></div>';$("backHomeBtn").onclick=goHome}
function goHome(){$("quizScreen").classList.add("hidden");$("resultScreen").classList.add("hidden");$("historyScreen").classList.add("hidden");$("startScreen").classList.remove("hidden")}
$("startBtn").onclick=()=>startQuiz(false);$("wrongBtn").onclick=()=>startQuiz(true);$("historyBtn").onclick=showHistoryScreen;$("prevBtn").onclick=()=>{if(currentIndex>0){currentIndex--;renderQuestion()}};$("nextBtn").onclick=()=>{if(currentIndex<quizItems.length-1){currentIndex++;renderQuestion()}};$("submitBtn").onclick=()=>{try{submitQuiz()}catch(e){console.error(e);alert("Có lỗi khi nộp bài: "+(e&&e.message?e.message:e))}};
</script></body></html>
